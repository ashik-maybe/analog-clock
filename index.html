<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" id="metaTheme" content="#e4e7ec" />
        <title>Local Time</title>
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23fff' stroke='%2317181a' stroke-width='6'/%3E%3Cpath d='M32 32V15' stroke='%2317181a' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 32l14 9' stroke='%2317181a' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M32 32l-8 14' stroke='%23d92b2b' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
        />
        <link rel="manifest" href="/analog-clock/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/analog-clock/icons/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Local Time" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="mobile-web-app-capable" content="yes" />
        <script>
            /* set theme before first paint: saved choice > device preference */
            (function () {
                try {
                    var s = localStorage.getItem("clock-theme");
                    var dark = s
                        ? s === "dark"
                        : matchMedia("(prefers-color-scheme: dark)").matches;
                    document.documentElement.dataset.theme = dark ? "dark" : "light";
                    document.getElementById("metaTheme").content = dark ? "#0a0b0d" : "#e4e7ec";
                } catch (e) {
                    document.documentElement.dataset.theme = "light";
                    document.getElementById("metaTheme").content = "#e4e7ec";
                }
            })();
        </script>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <div class="bg bg-light"></div>
        <div class="bg bg-dark"></div>

        <button
            class="icon-btn"
            id="themeBtn"
            aria-label="Toggle color theme"
            aria-pressed="false"
            title="Toggle theme (T)"
        >
            <svg
                class="ic ic-sun"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
                focusable="false"
            >
                <circle cx="12" cy="12" r="4.4" />
                <path
                    d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.2 5.2l1.8 1.8M17 17l1.8 1.8M18.8 5.2L17 7M7 17l-1.8 1.8"
                />
            </svg>
            <svg
                class="ic ic-moon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
            >
                <path d="M20.6 13.2A8.6 8.6 0 1 1 10.8 3.4a7 7 0 1 0 9.8 9.8z" />
            </svg>
        </button>

        <main>
            <time id="a11yTime" class="sr-only"></time>
            <div class="stage">
                <div class="clockwrap" id="wrap" aria-hidden="true">
                    <div class="clock" id="clock">
                        <div class="lip"></div>
                        <div class="dial" aria-hidden="true">
                            <div id="ticks"></div>
                            <div id="numerals"></div>
                            <div class="hand hand-hour" id="hHour">
                                <span class="blade"></span><span class="tail"></span>
                            </div>
                            <div class="hand hand-minute" id="hMin">
                                <span class="blade"></span><span class="tail"></span>
                            </div>
                            <div class="hand hand-second step" id="hSec">
                                <span class="blade"></span><span class="tail"></span>
                            </div>
                            <div class="cap"></div>
                            <div class="glass" id="glass"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div class="grain"></div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
